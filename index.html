<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07070d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WebGL Shooter Arena - Modular</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/touch.css">

</head>

<body>

    <div id="ui-layer">

        <div id="crosshair"></div>

        <div id="hud-top-right" aria-label="Munición total">
            <div id="ammo-display">∞</div>
            <div id="performance-overlay" aria-label="Uso de CPU, GPU y memoria">
                <div><strong>FPS</strong> <span id="hud-fps-info">N/D</span></div>
                <div><strong>CPU</strong> <span id="hud-cpu-info">N/D</span></div>
                <div><strong>GPU</strong> <span id="hud-gpu-info">N/D</span></div>
                <div><strong>RAM</strong> <span id="hud-ram-info">N/D</span></div>
            </div>
        </div>

        <div id="respawn-hint" role="status" aria-live="polite">
            Clic izquierdo para reaparecer
        </div>
    </div>

    <div id="loading-screen" role="status" aria-live="polite" aria-busy="false" aria-hidden="true">
        <div class="loading-card">
            <div class="loading-title">CARGANDO</div>
            <div id="loading-map-name" class="loading-map-name">MAPA</div>
            <div class="loading-spinner" aria-hidden="true"></div>
        </div>
    </div>

    <div id="start-screen">
        <h1>ARENA SHOOTER</h1>
        <p class="pause-subtitle">Haz click para jugar</p>
        <p class="controls-info">WASD: Moverse | ESPACIO: Saltar</p>
        <p class="controls-info">Click: Disparar | Scroll: Cambiar Arma</p>
        <p class="controls-info">Ctrl: Agacharse y moverse más despacio</p>

        <!-- Botones del menú de pausa -->
        <div id="pause-buttons">
            <button id="menu-btn" class="pause-menu-btn">🏠 MENÚ</button>
            <button id="settings-btn" class="pause-menu-btn">⚙️ AJUSTES</button>
            <button id="debug-btn" class="pause-menu-btn">DEBUG</button>

        </div>
    </div>

    <!-- Menú de Ajustes -->
    <div id="settings-menu" class="settings-overlay">
        <div class="settings-panel">
            <h2 class="settings-title">⚙️ AJUSTES</h2>

            <div class="settings-section">
                <label class="settings-label">
                    <span class="label-icon">🎵</span> Música
                    <span id="music-volume-value" class="volume-value">30%</span>
                </label>
                <input type="range" id="music-volume" class="volume-slider" min="0" max="100" value="30">
            </div>

            <div class="settings-section">
                <label class="settings-label">
                    <span class="label-icon">🔊</span> Efectos
                    <span id="sfx-volume-value" class="volume-value">50%</span>
                </label>
                <input type="range" id="sfx-volume" class="volume-slider" min="0" max="100" value="50">
            </div>

            <div class="settings-section">
                <label class="settings-label">
                    <span class="label-icon">🎯</span> Autoapuntado
                    <span id="aim-assist-value" class="volume-value">5</span>
                </label>
                <input type="range" id="aim-assist-strength" class="volume-slider" min="0" max="10" step="1" value="5">
            </div>

            <div class="settings-section">
                <label class="settings-label" for="resolution-select">
                    <span><span class="label-icon">🖥️</span> Resolución</span>
                    <select id="resolution-select" class="settings-select" aria-label="Resolución">
                        <option value="1080p">1080p (1920 × 1080)</option>
                        <option value="720p">720p (1280 × 720)</option>
                    </select>
                </label>
            </div>

            <button id="settings-close-btn" class="settings-btn">CERRAR</button>
        </div>
    </div>



    <script type="module" src="./src/main.js"></script>
</body>

</html>
